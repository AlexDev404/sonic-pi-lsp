name: Android

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      signed:
        description: "Sign the release APK with the keystore in the repository's secrets"
        type: boolean
        default: false

jobs:
  # The native core on Linux: Sonic Pi programs rendered to audio and checked.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: dtolnay/rust-toolchain@stable
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: mruby and the runtime's bytecode
        run: native/build-mruby.sh build/core
      - name: The native core and its test
        run: |
          cmake -G Ninja -B build/native -S native -DSP_BUILD="$PWD/build/core" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --target sonic_pi_render_test sonic_pi_load_bench
      - name: Render programs and check what they play
        run: mkdir -p build/renders && cd build/renders && ../native/sonic_pi_render_test
      - name: How hard a full track works the core
        run: build/native/sonic_pi_load_bench native/test/programs/full_track.rb 120 | grep -Ev '^ +[0-9]+ '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sonic-pi-native-renders
          path: build/renders/*.wav
          if-no-files-found: warn

  # The app: unit and screenshot tests, and the APKs.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;29.0.14206865 cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v6
      # A signed build (run by hand, "signed" ticked): the keystore from the secrets, base64 in
      # ANDROID_KEYSTORE_BASE64, with ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.
      - name: Keystore
        if: github.event_name == 'workflow_dispatch' && inputs.signed
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!s}" ] || { echo "::error::the secret ANDROID_$s is not set"; exit 1; }
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build
        working-directory: android
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.signed && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          SIGNING_KEY_ALIAS: ${{ github.event_name == 'workflow_dispatch' && inputs.signed && secrets.ANDROID_KEY_ALIAS || '' }}
          SIGNING_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.signed && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest -Proborazzi.test.record=true :app:assembleDebug :app:assembleRelease
      - name: Name the APKs
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/sonic-pi-debug.apk
          release=sonic-pi-release.apk
          [ -n "$SIGNING_KEYSTORE" ] && release=sonic-pi-release-signed.apk
          cp android/app/build/outputs/apk/release/app-release.apk "apk/$release"
          # whose key signed it, in the log
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "apk/$release"
      - name: Forget the keystore
        if: always() && env.SIGNING_KEYSTORE != ''
        run: rm -f "$SIGNING_KEYSTORE"
      - uses: actions/upload-artifact@v7
        with:
          name: sonic-pi-android-apk
          path: apk/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sonic-pi-android-screenshots
          path: android/app/build/outputs/roborazzi/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: sonic-pi-android-test-reports
          path: android/app/build/reports/tests
